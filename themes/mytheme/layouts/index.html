{{ define "styles" }}
<style>
  .home-intro {
    max-width: 48rem;
    margin: 0 auto;
    padding: var(--spacing-2xl) var(--spacing-md);
    text-align: center;
  }

  .home-intro h1 {
    margin-bottom: var(--spacing-lg);
    font-size: var(--font-size-2xl);
  }

  .home-image {
    width: min(100%, 20rem);
    height: auto;
    aspect-ratio: 1;
    margin: 0 auto var(--spacing-lg);
    border-radius: 50%;
    object-fit: cover;
  }
</style>
{{ end }}

{{ define "main" }}
<section class="home-intro" aria-labelledby="about-title">
  <h1 id="about-title">{{ .Title }}</h1>

  <img
    src="{{ .Params.image | relURL }}"
    alt="Drawing representing Tory Leone"
    class="home-image"
    width="1096"
    height="1028"
  >

  {{ .Content }}
</section>
{{ end }}

{{ define "styles" }}
<style>
  .gallery-feed {
    max-width: var(--max-width);
    margin: 0 auto;
    padding: var(--spacing-xl) var(--spacing-md) var(--spacing-2xl);
  }

  .gallery-feed__heading {
    margin-bottom: var(--spacing-lg);
  }

  .gallery-feed__grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: var(--spacing-xs);
  }

  .gallery-feed__item {
    position: relative;
    overflow: hidden;
    aspect-ratio: 1 / 1;
    border: 0;
    border-radius: 0;
  }

  .gallery-feed__item img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.25s ease;
  }

  .gallery-feed__item:hover img {
    transform: scale(1.02);
  }

  .gallery-feed__item--hidden {
    display: none;
  }

  .gallery-feed__multi-badge {
    position: absolute;
    z-index: 2;
    top: var(--spacing-sm);
    right: var(--spacing-sm);
    width: var(--icon-size-sm);
    height: var(--icon-size-sm);
    color: var(--color-white);
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.5));
    pointer-events: none;
  }

  .gallery-feed__multi-badge svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  @media (max-width: 900px) {
    .gallery-feed__grid {
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    }
  }

  @media (max-width: 600px) {
    .gallery-feed__grid {
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    }
  }
</style>
{{ end }}

{{ define "main" }}
  {{ partial "gallery/feed.html" . }}
{{ end }}
